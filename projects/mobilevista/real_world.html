<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Real-world Rollouts</title>
<link href="https://fonts.googleapis.com/css?family=Google+Sans" rel="stylesheet">
<link rel="stylesheet" href="main.css">
<style>
  :root {
    --bg: #ffffff;
    --fg: #4a4a4a;
    --muted: #53565A;
    --accent: #8C1515;
    --grid: #d8d8d8;
    --axis: rgba(46,45,41,0.45);
    --circle-fill: rgba(46,45,41,0.05);
    --circle-stroke: #2E2D29;
    --dot: #53565A;
    --dot-edge: #2E2D29;
    --dot-hover: #8C1515;
    --dot-active: #8C1515;
    --dot-active-edge: #5a0e0e;
  }
  html, body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    padding: 0;
  }
  body {
    font-family: "Google Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0;
  }

  .top-figure {
    text-align: center;
    margin-bottom: 16px;
  }
  .top-figure img {
    max-width: 100%;
    height: auto;
  }

  .hint {
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    margin-bottom: 12px;
    font-style: italic;
  }
  @media (max-width: 600px) {
    .hint { font-size: 0.8rem; }
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr);
    gap: 16px;
    align-items: start;  /* changed from center */
}

  .plot-col {
    min-width: 0;
  }

  svg.plot { width: 100%; height: auto; display: block; }
  svg.plot .dot { cursor: pointer; transition: transform 0.08s ease; transform-box: fill-box; transform-origin: center; }
  svg.plot .dot:hover { transform: scale(1.25); fill: var(--dot-hover); }
  svg.plot .dot.active { fill: var(--dot-active); stroke: var(--dot-active-edge); transform: scale(1.35); }

  .info {
    margin-top: 8px;
    font-family: "Google Sans", sans-serif;
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
  }
  @media (max-width: 600px) {
    .info { font-size: 0.8rem; }
  }

  .videos {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    min-width: 0;   
  }

  .vpanel {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 0;
  }
  .vpanel video {
    width: 100%;
    display: block;
    border-radius: 6px;
    aspect-ratio: 160 / 96;
}
  .vpanel .empty {
    width: 100%;
    aspect-ratio: 160 / 96;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.85rem;
    background: #f4f4f4;
    border-radius: 6px;
    font-style: italic;
}
  .vpanel .label {
    margin-top: 6px;
    font-family: "Google Sans", sans-serif;
    font-weight: 600;
    font-size: 1rem;
    color: var(--fg);
    text-align: center;
    line-height: 1.2;
  }
  .vpanel[data-policy="ours"] .label {
    color: #c0392b;
  }
  .vpanel .outcome {
    margin-top: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    height: auto;
    min-height: 22px;
  }
  .vpanel .outcome svg { display: block; }

  @media (max-width: 600px) {
    .vpanel .empty { font-size: 0.8rem; }
    .vpanel .label { font-size: 0.8rem; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="layout">
    <div class="plot-col">
      <svg class="plot" id="plot" viewBox="0 0 400 400"></svg>
      <div class="info" id="info">No rollout selected.</div>
    </div>

    <div class="videos" id="videos">
      <div class="vpanel" data-policy="2d">
        <div class="empty">click a dot</div>
        <div class="label">2D</div>
        <div class="outcome"></div>
      </div>
      <div class="vpanel" data-policy="dp3">
        <div class="empty">click a dot</div>
        <div class="label">DP3</div>
        <div class="outcome"></div>
      </div>
      <div class="vpanel" data-policy="pi05">
        <div class="empty">click a dot</div>
        <div class="label">Fine-tuned &pi;<sub>0.5</sub></div>
        <div class="outcome"></div>
      </div>
      <div class="vpanel" data-policy="ours">
        <div class="empty">click a dot</div>
        <div class="label">MobileVISTA (Ours)</div>
        <div class="outcome"></div>
      </div>
    </div>
  </div>
</div>

<script>
const VIDEOS_BASE = "assets/book_random_new_videos/";

// Each trial:
//   x, y           : object offset in cm
//   vids           : { policy: timestamp string }
//   outcomes       : { policy: "stacked" | "grasped" | "fail" | "fail-joint" }
const TRIALS = [
  { x: +7.68,  y: -11.34, vids: { "2d": "2026-05-21-19-29-35", dp3: "2026-05-21-19-27-22", pi05: "2026-05-21-19-34-12", ours: "2026-05-21-19-31-12" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "fail-joint" } },
  { x: -5.46,  y: +13.54, vids: { "2d": "2026-05-21-19-38-56", dp3: "2026-05-21-19-39-53", pi05: "2026-05-21-19-38-18", ours: "2026-05-21-19-41-25" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "stacked" } },
  { x: +1.75,  y: +11.81, vids: { "2d": "2026-05-21-19-49-11", dp3: "2026-05-21-19-54-01", pi05: "2026-05-21-19-51-01", ours: "2026-05-21-19-47-37" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "fail-joint" } },
  { x: -4.85,  y:  +8.96, vids: { "2d": "2026-05-21-20-01-04", dp3: "2026-05-21-19-58-53", pi05: "2026-05-21-19-57-46", ours: "2026-05-21-20-02-05" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "stacked" } },
  { x: -5.98,  y: -10.25, vids: { "2d": "2026-05-21-20-08-11", dp3: "2026-05-21-20-09-48", pi05: "2026-05-21-20-12-44", ours: "2026-05-21-20-11-19" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "stacked" } },
  { x: +0.90,  y: -13.28, vids: { "2d": "2026-05-21-20-28-21", dp3: "2026-05-21-20-24-20", pi05: "2026-05-21-20-26-53", ours: "2026-05-21-20-23-03" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "fail-joint" } },
  { x: +5.49,  y:  +8.37, vids: { "2d": "2026-05-21-20-32-49", dp3: "2026-05-21-20-38-08", pi05: "2026-05-21-20-37-03", ours: "2026-05-21-20-39-13" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "grasped" } },
  { x: +2.52,  y:  -0.17, vids: { "2d": "2026-05-21-20-46-14", dp3: "2026-05-21-20-44-55", pi05: "2026-05-21-20-43-49", ours: "2026-05-21-20-48-00" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "stacked" } },
  { x: -5.52,  y:  -5.78, vids: { "2d": "2026-05-21-20-55-39", dp3: "2026-05-21-20-52-37", pi05: "2026-05-21-20-57-24", ours: "2026-05-21-20-53-41" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "stacked" } },
  { x: -1.54,  y:  +3.27, vids: { "2d": "2026-05-21-21-01-08", dp3: "2026-05-21-21-02-25", pi05: "2026-05-21-21-06-28", ours: "2026-05-21-21-04-32" }, outcomes: { "2d": "stacked", dp3: "stacked", pi05: "stacked", ours: "stacked" } },
  { x: +7.80,  y:  +6.81, vids: { "2d": "2026-05-21-21-18-34", dp3: "2026-05-21-21-15-53", pi05: "2026-05-21-21-14-31", ours: "2026-05-21-21-22-49" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "grasped" } },
  { x: -7.56,  y: -11.43, vids: { "2d": "2026-05-21-21-32-15", dp3: "2026-05-21-21-29-04", pi05: "2026-05-21-21-27-49", ours: "2026-05-21-21-30-37" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "fail" } },
  { x: -6.20,  y: +13.30, vids: { "2d": "2026-05-21-21-44-47", dp3: "2026-05-21-21-42-47", pi05: "2026-05-21-21-44-03", ours: "2026-05-21-21-46-08" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "stacked" } },
  { x: +3.75,  y: -10.47, vids: { "2d": "2026-05-21-21-56-35", dp3: "2026-05-21-21-51-16", pi05: "2026-05-21-21-52-24", ours: "2026-05-21-21-54-47" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "fail-joint" } },
  { x: +0.59,  y: +13.75, vids: { "2d": "2026-05-21-22-05-09", dp3: "2026-05-21-22-00-28", pi05: "2026-05-21-22-01-28", ours: "2026-05-21-22-02-36" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "stacked" } },
  { x: +8.10,  y:  +8.39, vids: { "2d": "2026-05-21-22-11-57", dp3: "2026-05-21-22-13-46", pi05: "2026-05-21-22-14-44", ours: "2026-05-21-22-10-26" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "fail-joint" } },
  { x: +5.66,  y:  -6.74, vids: { "2d": "2026-05-21-23-05-51", dp3: "2026-05-21-23-03-02", pi05: "2026-05-21-23-03-58", ours: "2026-05-21-23-01-26" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "fail-joint" } },
  { x: -4.66,  y: +11.66, vids: { "2d": "2026-05-21-23-16-12", dp3: "2026-05-21-23-13-01", pi05: "2026-05-21-23-17-17", ours: "2026-05-21-23-13-50" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "stacked" } },
  { x: -7.66,  y:  -0.40, vids: { "2d": "2026-05-21-23-24-52", dp3: "2026-05-21-23-23-40", pi05: "2026-05-21-23-22-51", ours: "2026-05-21-23-26-20" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "stacked" } },
  { x: +6.66,  y:  -1.10, vids: { "2d": "2026-05-21-23-32-22", dp3: "2026-05-21-23-31-13", pi05: "2026-05-21-23-36-52", ours: "2026-05-21-23-35-02" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "grasped" } },
  { x: -1.94,  y:  +3.21, vids: { "2d": "2026-05-21-23-45-54", dp3: "2026-05-21-23-40-56", pi05: "2026-05-21-23-44-29", ours: "2026-05-21-23-42-24" }, outcomes: { "2d": "fail", dp3: "grasped", pi05: "stacked", ours: "stacked" } },
  { x: -4.92,  y:  +6.66, vids: { "2d": "2026-05-21-23-55-35", dp3: "2026-05-21-23-58-13", pi05: "2026-05-21-23-54-54", ours: "2026-05-21-23-56-38" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "stacked" } },
  { x: -9.70,  y:  +8.50, vids: { "2d": "2026-05-22-00-30-28", dp3: "2026-05-22-00-31-55", pi05: "2026-05-22-00-26-09", ours: "2026-05-22-00-27-56" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "stacked" } },
  { x: +13.86, y:  -3.69, vids: { "2d": "2026-05-22-00-37-12", dp3: "2026-05-22-00-40-35", pi05: "2026-05-22-00-41-45", ours: "2026-05-22-00-38-38" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "fail-joint" } },
  { x: +1.44,  y:  -7.08, vids: { "2d": "2026-05-22-00-49-20", dp3: "2026-05-22-00-45-04", pi05: "2026-05-22-00-47-49", ours: "2026-05-22-00-46-35" }, outcomes: { "2d": "fail", dp3: "fail", pi05: "fail-joint", ours: "grasped" } },
];

const POLICY_ORDER = ["2d", "dp3", "pi05", "ours"];

const OUTCOME_LABEL = {
  "stacked":    "Stacked",
  "grasped":    "Grasped",
  "fail":       "Fail",
  "fail-joint": "Fail (joint limits exceeded)",
};

function outcomeSVG(outcome) {
  if (outcome === "stacked") {
    return `<svg viewBox="0 0 20 20" width="18" height="18"><circle cx="10" cy="10" r="8" fill="#2ecc71" stroke="#1a8a4a" stroke-width="0.8"><title>${OUTCOME_LABEL[outcome]}</title></circle></svg>`;
  }
  if (outcome === "grasped") {
    return `<svg viewBox="0 0 20 20" width="18" height="18"><circle cx="10" cy="10" r="8" fill="#f1c40f" stroke="#a07d08" stroke-width="0.8"><title>${OUTCOME_LABEL[outcome]}</title></circle></svg>`;
  }
  if (outcome === "fail") {
    return `<svg viewBox="0 0 20 20" width="18" height="18"><circle cx="10" cy="10" r="8" fill="#e74c3c" stroke="#922b21" stroke-width="0.8"><title>${OUTCOME_LABEL[outcome]}</title></circle></svg>`;
  }
  return `<svg viewBox="0 0 20 20" width="18" height="18"><path d="M 4 4 L 16 16 M 16 4 L 4 16" stroke="#e74c3c" stroke-width="3.2" stroke-linecap="round" fill="none"><title>${OUTCOME_LABEL[outcome]}</title></path></svg>`;
}

function signed(n) {
  const v = Number(n).toFixed(2);
  return v.startsWith("-") ? v : "+" + v;
}

function videoFilename(trial, policy) {
  const xs = signed(trial.x);
  const ys = signed(trial.y);
  const ts = trial.vids[policy];
  return `${VIDEOS_BASE}x${xs}_y${ys}_${policy}_${ts}.mp4`;
}

// --- plot -----------------------------------------------------------------
const L = 16, R = 15;
const VB = 400;
const MARGIN = 36;
const PLOT = VB - 2 * MARGIN;
const NS = "http://www.w3.org/2000/svg";
const sx = (x) => MARGIN + ((x + L) / (2 * L)) * PLOT;
const sy = (y) => MARGIN + ((L - y) / (2 * L)) * PLOT;

const svg = document.getElementById("plot");

const c = document.createElementNS(NS, "circle");
c.setAttribute("cx", sx(0)); c.setAttribute("cy", sy(0));
c.setAttribute("r", (R / (2 * L)) * PLOT);
c.setAttribute("fill", "var(--circle-fill)");
c.setAttribute("stroke", "var(--circle-stroke)");
c.setAttribute("stroke-width", "1.2");
c.setAttribute("stroke-dasharray", "4 3");
svg.appendChild(c);

const ticks = [-15, -10, -5, 5, 10, 15];
for (const t of ticks) {
  const vx = document.createElementNS(NS, "line");
  vx.setAttribute("x1", sx(t)); vx.setAttribute("x2", sx(t));
  vx.setAttribute("y1", sy(-L)); vx.setAttribute("y2", sy(L));
  vx.setAttribute("stroke", "var(--grid)"); vx.setAttribute("stroke-width", "0.5");
  vx.setAttribute("opacity", "0.5");
  svg.appendChild(vx);
  const vy = document.createElementNS(NS, "line");
  vy.setAttribute("y1", sy(t)); vy.setAttribute("y2", sy(t));
  vy.setAttribute("x1", sx(-L)); vy.setAttribute("x2", sx(L));
  vy.setAttribute("stroke", "var(--grid)"); vy.setAttribute("stroke-width", "0.5");
  vy.setAttribute("opacity", "0.5");
  svg.appendChild(vy);
}

const ax1 = document.createElementNS(NS, "line");
ax1.setAttribute("x1", sx(-L)); ax1.setAttribute("x2", sx(L));
ax1.setAttribute("y1", sy(0));  ax1.setAttribute("y2", sy(0));
ax1.setAttribute("stroke", "var(--axis)"); ax1.setAttribute("stroke-width", "1.5");
svg.appendChild(ax1);
const ax2 = document.createElementNS(NS, "line");
ax2.setAttribute("x1", sx(0));  ax2.setAttribute("x2", sx(0));
ax2.setAttribute("y1", sy(-L)); ax2.setAttribute("y2", sy(L));
ax2.setAttribute("stroke", "var(--axis)"); ax2.setAttribute("stroke-width", "1.5");
svg.appendChild(ax2);

for (const t of ticks) {
  const tx = document.createElementNS(NS, "text");
  tx.setAttribute("x", sx(t)); tx.setAttribute("y", sy(0) + 14);
  tx.setAttribute("text-anchor", "middle"); tx.setAttribute("font-size", "10");
  tx.setAttribute("font-family", "Google Sans, sans-serif");
  tx.setAttribute("font-weight", "600"); tx.setAttribute("fill", "var(--muted)");
  tx.textContent = t; svg.appendChild(tx);
  const ty = document.createElementNS(NS, "text");
  ty.setAttribute("x", sx(0) - 6); ty.setAttribute("y", sy(t) + 3);
  ty.setAttribute("text-anchor", "end"); ty.setAttribute("font-size", "10");
  ty.setAttribute("font-family", "Google Sans, sans-serif");
  ty.setAttribute("font-weight", "600"); ty.setAttribute("fill", "var(--muted)");
  ty.textContent = t; svg.appendChild(ty);
}

const dots = [];
const DOT_R = 7.5;
TRIALS.forEach((trial, i) => {
  const dot = document.createElementNS(NS, "circle");
  dot.setAttribute("class", "dot");
  dot.setAttribute("cx", sx(trial.x));
  dot.setAttribute("cy", sy(trial.y));
  dot.setAttribute("r", DOT_R);
  dot.setAttribute("fill", "var(--dot)");
  dot.setAttribute("stroke", "var(--dot-edge)");
  dot.setAttribute("stroke-width", "0.8");
  dot.setAttribute("data-trial", i);
  dot.addEventListener("click", () => selectTrial(i));
  const title = document.createElementNS(NS, "title");
  title.textContent = `Trial ${i} — (${trial.x.toFixed(2)}, ${trial.y.toFixed(2)})`;
  dot.appendChild(title);
  svg.appendChild(dot);
  dots.push(dot);
});

const info = document.getElementById("info");
const videosEl = document.getElementById("videos");

function selectTrial(i) {
  const trial = TRIALS[i];
  dots.forEach((d, j) => d.classList.toggle("active", j === i));
  const xDir = trial.x >= 0 ? "Right" : "Left";
  const yDir = trial.y >= 0 ? "Forward" : "Back";
  info.innerHTML = `Trial ${i}<br>${xDir} ${Math.abs(trial.x).toFixed(2)} cm, ${yDir} ${Math.abs(trial.y).toFixed(2)} cm`;

  for (const policy of POLICY_ORDER) {
    const panel = videosEl.querySelector(`.vpanel[data-policy="${policy}"]`);

    let v = panel.querySelector("video");
    if (!v) {
      v = document.createElement("video");
      v.controls = true;
      v.muted = true;
      v.playsInline = true;
      v.style.width = "100%";
      v.style.display = "block";
      v.style.borderRadius = "6px";
      const empty = panel.querySelector(".empty");
      if (empty) empty.style.display = "none";
      panel.insertBefore(v, panel.firstChild);
    }

    v.src = videoFilename(trial, policy);
    v.load();

    panel.querySelector(".outcome").innerHTML = outcomeSVG(trial.outcomes[policy]);
  }
}

// Default to a representative trial (Left 4.85cm, Forward 8.96cm) so the panel isn't empty on load.
const DEFAULT_TRIAL = TRIALS.findIndex(t => t.x === -4.85 && t.y === 8.96);
if (DEFAULT_TRIAL !== -1) selectTrial(DEFAULT_TRIAL);

// Report own size to parent
(function () {
  const send = () => {
    const h = Math.max(
      document.body.scrollHeight,
      document.documentElement.scrollHeight
    );
    parent.postMessage({ type: 'iframe-resize', height: h }, '*');
  };
  window.addEventListener('load', send);
  window.addEventListener('resize', send);
  if (window.ResizeObserver) {
    new ResizeObserver(send).observe(document.body);
  }
})();
</script>

</body>
</html>
